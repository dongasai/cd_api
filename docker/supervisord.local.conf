; Dev Container Supervisord 配置 - 开发环境
; Apache + SSH + Laravel 后台任务由 Supervisor 统一管理

[supervisord]
nodaemon=true
user=root
logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/supervisord.log
pidfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/supervisord.pid

[program:apache]
; Apache Web Server
command=bash -c "rm -f /var/run/apache2/apache2.pid /var/run/apache2/apache2.pid.lock && /usr/sbin/apache2ctl -D FOREGROUND"
directory=/data/project/ai_proxy/coding_api/laravel
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/apache-access.log
stderr_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/apache-error.log
stopasgroup=true
killasgroup=true

[program:sshd]
; SSH Server
command=/usr/sbin/sshd -D
directory=/data/project/ai_proxy/coding_api/laravel
autostart=true
autorestart=true
stdout_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/sshd.log
stderr_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/sshd-error.log
stopasgroup=true
killasgroup=true

[program:init-permissions]
command=bash -c "mkdir -p /data/project/ai_proxy/coding_api/laravel/storage/logs /data/project/ai_proxy/coding_api/laravel/storage/app/public /data/project/ai_proxy/coding_api/laravel/storage/framework/cache /data/project/ai_proxy/coding_api/laravel/storage/framework/sessions /data/project/ai_proxy/coding_api/laravel/storage/framework/views /data/project/ai_proxy/coding_api/laravel/bootstrap/cache && chown -R php:php /data/project/ai_proxy/coding_api/laravel/storage /data/project/ai_proxy/coding_api/laravel/bootstrap/cache && chmod -R 775 /data/project/ai_proxy/coding_api/laravel/storage /data/project/ai_proxy/coding_api/laravel/bootstrap/cache && sleep 1"
directory=/data/project/ai_proxy/coding_api/laravel
autostart=true
autorestart=false
startsecs=0
startretries=1
stdout_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/init-permissions.log
stderr_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/init-permissions.log

[program:queue-worker]
command=php artisan queue:listen -v --sleep=3 --tries=3
directory=/data/project/ai_proxy/coding_api/laravel
autostart=true
autorestart=true
user=php
stdout_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/queue-worker.log
stderr_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/queue-worker.log

[program:schedule-worker]
command=php artisan schedule:work -v
directory=/data/project/ai_proxy/coding_api/laravel
autostart=true
autorestart=true
user=php
stdout_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/schedule-worker.log
stderr_logfile=/data/project/ai_proxy/coding_api/laravel/storage/logs/schedule-worker.log